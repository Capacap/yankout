[workspace]
members = ["core"]

[workspace.package]
version = "1.0.0"
edition = "2024"
repository = "https://github.com/Capacap/yankout"
license = "MIT OR Apache-2.0"

[package]
name = "yankout"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Wayland clipboard picker whose entries leave by drag"
readme = "README.md"
keywords = ["wayland", "clipboard", "drag-and-drop", "gtk4"]
categories = ["command-line-utilities", "gui"]
exclude = [".github"]

[dependencies]
yankout-core = { path = "core", version = "1.0.0" }
clap = { version = "4", features = ["derive"] }
gtk4 = { version = "0.11", features = ["v4_12"] }
