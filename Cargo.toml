[workspace]
members = ["core"]

[package]
name = "yankout"
version = "0.1.0"
edition = "2024"
description = "Wayland clipboard picker whose entries leave by drag"

[dependencies]
yankout-core = { path = "core" }
clap = { version = "4", features = ["derive"] }
gtk4 = { version = "0.11", features = ["v4_12"] }
